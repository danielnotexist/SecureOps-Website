    <!-- GA4 (same property/ID the old site used, G-XZ0FZE6S64, carried over so
         history isn't split across two properties). Consent Mode default is
         "denied" until CookieConsentBar (App.jsx) calls gtag('consent','update'),
         so no analytics cookie is set before a visitor actually agrees to one.
         send_page_view is off here -- App.jsx fires page_view itself on each
         route change, since this is a single-page app and the one load this
         script sees is never the whole story. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){window.dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'wait_for_update': 500
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XZ0FZE6S64"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-XZ0FZE6S64', {
        'send_page_view': false,
        'allow_google_signals': false
      });
    </script>
